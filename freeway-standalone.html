  <style>
/* CSS Design System */
:root {
  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Arial, "Noto Sans TC", sans-serif;
  --bg-dark: #0B0F19;
  --bg-card: #151D2A;
  --border-color: rgba(255, 255, 255, 0.1);
  --n1-color: #00A36C;
  --n1-bg: rgba(0, 163, 108, 0.15);
  --n3-color: #2563EB;
  --n3-bg: rgba(37, 99, 235, 0.15);
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.35);
  --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
body {
  font-family: var(--font-family);
  background-color: var(--bg-dark);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  padding: 16px;
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(0, 163, 108, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.08) 0%, transparent 40%);
  background-attachment: fixed;
}
.container { width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; }
.app-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px; background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); margin-bottom: 24px; box-shadow: var(--shadow-card);
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  width: 48px; height: 48px; background: linear-gradient(135deg, #00A36C 0%, #2563EB 100%);
  border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px;
}
.brand-title h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
.brand-title p { font-size: 0.85rem; color: var(--text-secondary); }
.refresh-btn {
  background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
  color: var(--text-primary); padding: 10px 18px; border-radius: var(--radius-sm);
  cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 500;
}
.main-layout { display: grid; grid-template-columns: 380px 1fr; gap: 24px; width: 100%; }
.sidebar { display: flex; flex-direction: column; gap: 20px; width: 100%; }
.card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-card); width: 100%;
}
.card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
.highway-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.highway-tab {
  padding: 14px; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.04);
  border: 2px solid transparent; color: var(--text-secondary); cursor: pointer; text-align: center; font-weight: 700;
}
.highway-tab.active[data-hw="n1"] { background: var(--n1-bg); border-color: var(--n1-color); color: #34D399; }
.highway-tab.active[data-hw="n3"] { background: var(--n3-bg); border-color: var(--n3-color); color: #60A5FA; }
.form-group { margin-bottom: 18px; width: 100%; }
.form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
.county-filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; width: 100%; -webkit-overflow-scrolling: touch; }
.county-chip {
  padding: 4px 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
  border-radius: 20px; font-size: 0.78rem; white-space: nowrap; cursor: pointer; color: var(--text-secondary);
}
.county-chip.active { background: rgba(255, 255, 255, 0.15); color: var(--text-primary); border-color: rgba(255, 255, 255, 0.3); }
.select-control {
  width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.95rem; outline: none;
}
.swap-btn-container { display: flex; justify-content: center; margin: -6px 0 12px 0; }
.swap-btn {
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: var(--text-primary);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.action-buttons { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 10px; }
.primary-btn {
  background: linear-gradient(135deg, #00A36C 0%, #059669 100%); border: none; color: white;
  padding: 14px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; cursor: pointer;
}
.bookmark-btn {
  background: rgba(255, 215, 0, 0.12); border: 1px solid rgba(255, 215, 0, 0.3); color: #FBBF24;
  padding: 0 16px; border-radius: var(--radius-sm); font-size: 1.1rem; cursor: pointer;
}
.preset-item {
  display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 8px;
}
.preset-name { font-size: 0.9rem; font-weight: 700; }
.preset-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; }
.content-area { display: flex; flex-direction: column; gap: 24px; width: 100%; }
.summary-card {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px;
  background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 24px; width: 100%;
}
.stat-box { display: flex; flex-direction: column; padding: 12px; background: rgba(255, 255, 255, 0.03); border-radius: var(--radius-md); }
.stat-label { font-size: 0.8rem; color: var(--text-secondary); }
.stat-value { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); }
.stat-unit { font-size: 0.8rem; font-weight: 400; color: var(--text-muted); }
.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }
.detour-card {
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
  border: 1px solid rgba(245, 158, 11, 0.4); border-radius: var(--radius-lg); padding: 24px; width: 100%;
}
.detour-card.smooth-route { border-color: rgba(16, 185, 129, 0.3); }
.detour-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
.detour-badge { background: rgba(245, 158, 11, 0.2); color: #FBBF24; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }
.detour-badge.no-detour { background: rgba(16, 185, 129, 0.2); color: #34D399; }
.detour-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
.comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.comparison-box { padding: 16px; border-radius: var(--radius-md); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); }
.comparison-box.alt-box { border-color: rgba(245, 158, 11, 0.5); background: rgba(245, 158, 11, 0.08); }
.turn-instructions { background: rgba(255, 255, 255, 0.03); border-radius: var(--radius-md); padding: 16px; }
.instruction-step { display: flex; gap: 12px; margin-bottom: 10px; font-size: 0.88rem; }
.step-num { background: rgba(255, 255, 255, 0.1); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
.visual-timeline { display: flex; align-items: center; overflow-x: auto; padding: 24px 10px; width: 100%; -webkit-overflow-scrolling: touch; }
.timeline-node { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
.node-dot { width: 18px; height: 18px; border-radius: 50%; background: #334155; border: 3px solid var(--bg-card); }
.node-dot.endpoint { background: #34D399; width: 22px; height: 22px; }
.node-name { font-size: 0.85rem; font-weight: 700; margin-top: 8px; white-space: nowrap; }
.node-km { font-size: 0.75rem; color: var(--text-muted); }
.timeline-segment { flex: 1; min-width: 70px; height: 8px; border-radius: 4px; margin: 0 -10px; position: relative; top: -18px; display: flex; align-items: center; justify-content: center; }
.segment-speed-tag { background: rgba(0, 0, 0, 0.8); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
.incidents-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.incident-item { display: flex; gap: 14px; padding: 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
.incident-icon { font-size: 1.5rem; padding: 8px; background: rgba(255, 255, 255, 0.05); border-radius: var(--radius-sm); }
.incident-header-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.app-footer { text-align: center; padding: 24px 0; margin-top: 30px; font-size: 0.82rem; color: var(--text-muted); border-top: 1px solid var(--border-color); }

/* MOBILE RESPONSIVE MEDIA QUERIES AT BOTTOM */
@media (max-width: 992px) {
  .main-layout { grid-template-columns: 1fr !important; gap: 16px; }
}
@media (max-width: 768px) {
  body { padding: 8px 4px !important; }
  .container { width: 100% !important; padding: 0 4px !important; }
  .app-header { flex-direction: column !important; align-items: stretch !important; padding: 14px 12px !important; gap: 10px !important; text-align: center !important; }
  .brand { justify-content: center !important; }
  .brand-icon { width: 36px !important; height: 36px !important; font-size: 20px !important; }
  .brand-title h1 { font-size: 1.05rem !important; line-height: 1.3 !important; }
  .header-status { width: 100% !important; }
  .refresh-btn { width: 100% !important; justify-content: center !important; padding: 10px !important; font-size: 0.85rem !important; }
  .card { padding: 14px 12px !important; border-radius: 12px !important; }
  .summary-card { padding: 12px !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
  .stat-box { padding: 8px !important; }
  .stat-value { font-size: 1.05rem !important; }
  .comparison-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
  .detour-card { padding: 14px 12px !important; }
  .detour-header { flex-direction: column !important; gap: 8px !important; }
  .detour-badge { align-self: flex-start !important; }
}
  </style>
</head>

class TrafficEngine {
  constructor() { this.generateMockIncidents(); }
  generateMockIncidents() {
    this.incidentsSeed = [
      { id: '1', highwayId: 'n1', km: 42.5, type: 'accident', title: '小客車追撞事故', severity: 'high', speedDrop: 45, icon: '💥', desc: '占用內側車道，警方已抵達處理中。', locationName: '國道1號 南向 42.5K', timestamp: '即時' },
      { id: '2', highwayId: 'n3', km: 78.0, type: 'construction', title: '路面修補施工', severity: 'medium', speedDrop: 25, icon: '🚧', desc: '占用外側路肩，請減速慢行。', locationName: '國道3號 北向 78.0K', timestamp: '即時' }
    ];
  }
  evaluateRoute(highwayId, startId, endId) {
    const hw = HIGHWAY_DATA[highwayId];
    const startIndex = hw.interchanges.findIndex(i => i.id === startId);
    const endIndex = hw.interchanges.findIndex(i => i.id === endId);
    if (startIndex === -1 || endIndex === -1) return null;

    const isSouthbound = startIndex < endIndex;
    const step = isSouthbound ? 1 : -1;
    const routeNodes = [];
    for (let i = startIndex; isSouthbound ? i <= endIndex : i >= endIndex; i += step) {
      routeNodes.push(hw.interchanges[i]);
    }

    const startKm = hw.interchanges[startIndex].km;
    const endKm = hw.interchanges[endIndex].km;
    const totalDist = Math.abs(endKm - startKm);
    const minKm = Math.min(startKm, endKm);
    const maxKm = Math.max(startKm, endKm);

    const activeInc = this.incidentsSeed.filter(inc => inc.highwayId === highwayId && inc.km >= minKm && inc.km <= maxKm);

    const segments = [];
    let totalMins = 0;
    let worstSpeed = 110;

    for (let i = 0; i < routeNodes.length - 1; i++) {
      const from = routeNodes[i];
      const to = routeNodes[i + 1];
      const segDist = Math.abs(to.km - from.km);
      let speed = 90;
      if (from.name.includes('林口') || from.name.includes('湖口') || from.name.includes('中和')) speed -= 25;
      activeInc.forEach(inc => speed -= inc.speedDrop);
      speed = Math.max(20, Math.min(110, speed));
      if (speed < worstSpeed) worstSpeed = speed;
      const travelMins = Math.round((segDist / speed) * 60);
      totalMins += travelMins;
      segments.push({ from, to, distance: Math.round(segDist*10)/10, speed, travelMins, status: this.getStatus(speed), incidents: activeInc });
    }

    const avgSpeed = Math.round(worstSpeed * 1.1);
    const rule = DETOUR_DATABASE[0];
    const detourMins = Math.round((totalDist * 1.1 / rule.baseSpeed) * 60);

    return {
      highway: hw, start: hw.interchanges[startIndex], end: hw.interchanges[endIndex],
      directionName: isSouthbound ? '南下' : '北上', totalDistance: Math.round(totalDist*10)/10,
      totalTravelMinutes: Math.max(1, totalMins), averageSpeed: avgSpeed, worstSpeed, overallStatus: this.getStatus(avgSpeed),
      segments, incidents: activeInc,
      detourAdvice: {
        recommended: worstSpeed < 50 || activeInc.length > 0, rule, detourTravelMins: detourMins,
        minutesSaved: totalMins - detourMins, reason: activeInc.length > 0 ? '目前發生事故壅塞，建議改道。' : '車流順暢，原國道最快。'
      }
    };
  }
  getStatus(speed) {
    if (speed >= 80) return { label: '順暢', color: '#10B981', bg: 'rgba(16,185,129,0.15)', icon: '🟢' };
    if (speed >= 60) return { label: '車多', color: '#84CC16', bg: 'rgba(132,204,22,0.15)', icon: '🟡' };
    if (speed >= 40) return { label: '壅塞', color: '#F59E0B', bg: 'rgba(245,158,11,0.15)', icon: '🟠' };
    return { label: '嚴重要塞', color: '#EF4444', bg: 'rgba(239,68,68,0.2)', icon: '🔴' };
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const engine = new TrafficEngine();
  let currentHw = 'n1';
  let savedPresets = JSON.parse(localStorage.getItem('freeway_saved_presets') || '[]');

  const startSel = document.getElementById('startInterchange');
  const endSel = document.getElementById('endInterchange');
  const swapBtn = document.getElementById('swapBtn');
  const queryBtn = document.getElementById('queryBtn');
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  function populateSelects() {
    const hw = HIGHWAY_DATA[currentHw];
    startSel.innerHTML = ''; endSel.innerHTML = '';
    hw.interchanges.forEach(item => {
      startSel.appendChild(new Option(`${item.km}K ${item.name} (${item.county})`, item.id));
      endSel.appendChild(new Option(`${item.km}K ${item.name} (${item.county})`, item.id));
    });
  }

  function query() {
    const res = engine.evaluateRoute(currentHw, startSel.value, endSel.value);
    if (!res) return;
    document.getElementById('summaryCard').innerHTML = `
      <div class="stat-box"><span class="stat-label">路段</span><span class="stat-value" style="font-size:1.1rem;">${res.start.name} ➔ ${res.end.name}</span><span class="stat-unit">${res.directionName} · ${res.totalDistance} km</span></div>
      <div class="stat-box"><span class="stat-label">平均時速</span><span class="stat-value" style="color:${res.overallStatus.color};">${res.averageSpeed} <span class="stat-unit">km/h</span></span></div>
      <div class="stat-box"><span class="stat-label">預估時間</span><span class="stat-value">${res.totalTravelMinutes} <span class="stat-unit">分鐘</span></span></div>
      <div class="stat-box"><span class="stat-label">狀況</span><div class="status-badge" style="background:${res.overallStatus.bg}; color:${res.overallStatus.color};">${res.overallStatus.icon} ${res.overallStatus.label}</div></div>
    `;

    const d = res.detourAdvice;
    document.getElementById('detourCardContainer').innerHTML = d.recommended ? `
      <div class="detour-card">
        <div class="detour-header"><div><div class="detour-title">⚠️ 建議改道路線</div><div style="font-size:0.9rem; color:#CBD5E1;">${d.reason}</div></div><div class="detour-badge">🛣️ 建議改道</div></div>
        <div class="comparison-grid">
          <div class="comparison-box"><div style="font-size:0.8rem; color:#94A3B8;">🚗 原國道</div><div style="font-size:1.3rem; font-weight:800;">${res.totalTravelMinutes} 分鐘</div></div>
          <div class="comparison-box alt-box"><div style="font-size:0.8rem; color:#FBBF24;">🛣️ ${d.rule.alternateRouteName}</div><div style="font-size:1.3rem; font-weight:800; color:#FBBF24;">預估 ${d.detourTravelMins} 分鐘</div></div>
        </div>
        <div class="turn-instructions"><div class="instruction-step"><span class="step-num">1</span><div><strong>切換指引：</strong>${d.rule.offRampInstruction}</div></div></div>
      </div>
    ` : `<div class="detour-card smooth-route"><div class="detour-title">🟢 路況順暢，行駛原國道最快！</div></div>`;
  }

  document.querySelectorAll('.highway-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.highway-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active'); currentHw = tab.dataset.hw;
      populateSelects(); query();
    });
  });

  swapBtn.addEventListener('click', () => {
    const t = startSel.value; startSel.value = endSel.value; endSel.value = t; query();
  });
  queryBtn.addEventListener('click', query);
  refreshBtn.addEventListener('click', () => { engine.generateMockIncidents(); query(); });

  populateSelects(); query();
});
  </script>
